directive @constrains(minLength: Int, maxLength: Int) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

type Query {
  continents: [Continent]!
  continent(code: String!): Continent!
  countries: [Country!]!
  country(code: String!): Country!
  languages: [Language]
  language(code: String!): Language
}

type Mutation {
  addCountry(input: CountryInput!): Country!
  updateCountry(code: String!, input: CountryInput!): Country!
  deleteCountry(code: String!): Boolean!

  addState(input: StateInput!): State!
  deleteState(code: String!): Boolean!

  addLanguage(input: LanguageInput!): Language!
  deleteLanguage(code: String!): Boolean!
}

type Continent {
  code: String!
  name: String!
  countries: [Country!]!
}

type Country {
  code: String! @constrains(minLength: 2, maxLength: 3)
  name: String! @constrains(minLength: 2, maxLength: 20)
  native: String
  phone: String!
  continent: Continent
  emoji: String
  emojiU: String  
  languages: [Language]
  }

type State {
  code: String!
  name: String!
  country: Country!
}

type Language {
  code: String!
  name: String!
  native: String
  rtl: Int
  country: Country!
}

input CountryInput {
  code: String! @constrains(minLength: 2, maxLength: 3)
  name: String! @constrains(minLength: 2, maxLength: 20)
  native: String
  phone: String!
  continent: String!
  currency: String
  emoji: String!
  emojiU: String
  population: Int!
}

input StateInput {
  code: String!
  name: String!
  country: String!
}

input LanguageInput {
  code: String!
  name: String!
  native: String!
  rtl: Int
  country: String!
}
